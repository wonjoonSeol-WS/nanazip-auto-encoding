name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that the installer keeps its UTF-8 BOM
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes('Install-NanaZipAutoCP.ps1')
          if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
            throw 'Install-NanaZipAutoCP.ps1 must be UTF-8 with a BOM, or Windows PowerShell 5.1 misreads its Korean labels'
          }

      - name: Build the menu DLL and the test programs
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call src\build.cmd

      - name: Encoding detection tests
        run: python -I tests/harness.py --detect-only

      - name: Menu DLL tests
        run: python -I tests/shell_test.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item Install-NanaZipAutoCP.ps1, Expand-ArchiveAuto.ps1, NanaZipAutoCP.dll, LICENSE -Destination dist

      - uses: actions/upload-artifact@v7
        with:
          name: nanazip-auto-encoding
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nanazip-auto-encoding
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          (cd dist && zip -r ../nanazip-auto-encoding.zip .)
          gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          gh release upload "$TAG" nanazip-auto-encoding.zip --repo "$REPO" --clobber
